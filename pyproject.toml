[project]
name = "bi-trading"
version = "0.1.0"
description = "Trading terminal shell for Hyperliquid and Polymarket"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "numpy>=2.4.6",
    "orjson>=3.13.0",
    "pyarrow>=26.0.1",
    "websockets>=12",
]

[project.optional-dependencies]
# Venue SDKs are kept out of the default install: the GUI must start without
# credentials, network access, or wallet keys present. Market data (above) uses
# the public endpoints and needs no SDK.
venues = [
    "hyperliquid-python-sdk>=0.9",
    "polymarket-client>=0.13",
    "eth-account>=0.11",
]
# The Rust walk. Optional because it needs a Rust toolchain to build; the app
# runs the same walk in Python without it. `uv sync --extra native` builds it.
native = ["bi-trading-core"]

[tool.uv.sources]
bi-trading-core = { path = "rust/bi_trading_core" }

[project.scripts]
bi-trading = "bi_trading.__main__:main"
bi-trading-hub = "bi_trading.ui.hub.main_hub:run"
bi-trading-strat = "bi_trading.ui.strat.strat:run"
bi-trading-builder = "bi_trading.ui.strat.strat_builder:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bi_trading"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["rust", "src/bi_trading/ui/assets"]

[tool.ruff.lint]
# A conservative set: real errors (undefined names, unused imports, bad syntax)
# without demanding a restyle of a hand-written codebase.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
