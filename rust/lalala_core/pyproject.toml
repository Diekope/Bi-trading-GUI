[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "lalala-core"
version = "0.1.0"
requires-python = ">=3.9"

[tool.maturin]
module-name = "lalala_core"

# Rebuild when the Rust changes. Without this uv keys its cache on this file
# alone and hands back a stale build after an edit to `src/lib.rs`.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
]
