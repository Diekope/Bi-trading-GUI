<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bi-trading (mock feeds)</title><link rel="stylesheet" href="../styles.css"></head>
<body>
<nav class="rail" id="rail"></nav>
<div class="col"><div class="row" id="topbar" style="min-height:22px;gap:14px"></div><main id="main"></main><div class="footer" id="footer"></div></div>
<div id="toast"></div>
<script>
// Offline demo: fake Hyperliquid and Polymarket endpoints that behave like the real ones, so the live wiring can be exercised without a network.
(() => {
  let seed = 7; const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32);
  const base = { HYPE: 76.2, BTC: 75760, ETH: 3100, SOL: 165 }, px = { ...base };
  const ms = { "1m": 6e4, "3m": 18e4, "5m": 3e5, "15m": 9e5, "30m": 18e5, "1h": 36e5 };
  const walk = () => Object.keys(px).forEach((k) => { px[k] += (rnd() - 0.5) * base[k] * 0.0004; });
  const candles = (coin, iv, n) => { const step = ms[iv], t0 = Math.floor(Date.now() / step) * step - (n - 1) * step; let p = base[coin]; const rows = Array.from({ length: n }, (_, i) => { const o = p, c = o + (rnd() - 0.5) * base[coin] * 0.0015; p = c; return { t: t0 + i * step, o, h: Math.max(o, c) + base[coin] * 0.0004, l: Math.min(o, c) - base[coin] * 0.0004, c, v: 20 + rnd() * 80 }; }); const off = px[coin] - rows[n - 1].c; return rows.map((r) => ({ t: r.t, o: String(r.o + off), h: String(r.h + off), l: String(r.l + off), c: String(r.c + off), v: String(r.v) })); };
  const end = () => (Math.floor(Date.now() / 3e5) + 1) * 3e5;
  window.fetch = async (url, o) => {
    await new Promise((r) => setTimeout(r, 30)); const ok = (j) => ({ ok: true, json: async () => j });
    if (String(url).includes("hyperliquid")) { const b = JSON.parse(o.body); if (b.type === "clearinghouseState") return ok({ marginSummary: { accountValue: "1204.37", totalMarginUsed: "88.2", totalNtlPos: "441.0" } }); if (b.req.startTime > Date.now() - 5 * 6e4 && b.req.startTime < Date.now() - 6e4 * 0.5 && false) return ok([]); const iv = b.req.interval, n = Math.min(300, Math.max(2, Math.round((b.req.endTime - b.req.startTime) / ms[iv]))); const c = candles(b.req.coin, iv, n); const w = end() - 3e5; if (b.req.coin === "BTC" && iv === "1m") c[c.length - 1].t = Math.floor(Date.now() / 6e4) * 6e4; return ok(c.length > 2 || n > 3 ? c : [{ t: w, o: "75726", h: "75740", l: "75700", c: "75730", v: "1" }]); }
    if (String(url).includes("gamma")) { const slug = new URL(url).searchParams.get("slug"); return ok([{ slug, question: "Bitcoin Up or Down (mock window)", clobTokenIds: '["tu","td"]', outcomes: '["Up","Down"]', outcomePrices: '["0.805","0.195"]', liquidity: "11400", acceptingOrders: true, endDate: new Date(end()).toISOString() }]); }
    return ok({ time: Date.now() });
  };
  window.WebSocket = class { constructor(u) { this.u = u; this.readyState = 0; this.subs = []; setTimeout(() => { this.readyState = 1; this.onopen && this.onopen(); this.loop = setInterval(() => this.tick(), 400); }, 50); }
    send(m) { const j = JSON.parse(m); if (j.method === "subscribe") this.subs.push(j.subscription); if (j.method === "ping") this.emit({ channel: "pong" }); }
    emit(o) { this.onmessage && this.onmessage({ data: JSON.stringify(o) }); }
    close() { clearInterval(this.loop); this.readyState = 3; this.onclose && this.onclose(); }
    tick() { walk();
      if (this.u.includes("hyperliquid")) { this.emit({ channel: "allMids", data: { mids: Object.fromEntries(Object.entries(px).map(([k, v]) => [k, String(v)])) } });
        this.emit({ channel: "bbo", data: { coin: "BTC", bbo: [{ px: String(px.BTC - 0.5) }, { px: String(px.BTC + 0.5) }] } });
        this.subs.filter((s) => s.type === "l2Book").forEach((s) => { const m = px[s.coin], d = m * 0.0001, lv = (sgn) => Array.from({ length: 12 }, (_, i) => ({ px: String(m + sgn * d * (i + 1)), sz: String(50 + rnd() * 800), n: 3 })); this.emit({ channel: "l2Book", data: { coin: s.coin, levels: [lv(-1), lv(1)], time: Date.now() } }); }); }
      else { const e = [], up = 0.8 + (rnd() - 0.5) * 0.02; [["tu", up], ["td", 1 - up - 0.01]].forEach(([t, p]) => { e.push({ event_type: "book", asset_id: t, bids: [0, 1, 2].map((i) => ({ price: (p - 0.005 - i * 0.01).toFixed(3), size: String(200 + rnd() * 500) })), asks: [0, 1, 2].map((i) => ({ price: (p + 0.005 + i * 0.01).toFixed(3), size: String(200 + rnd() * 500) })), timestamp: String(Date.now()) }); }); e.push({ event_type: "last_trade_price", asset_id: rnd() > 0.4 ? "tu" : "td", price: up.toFixed(2), size: String((1 + rnd() * 6).toFixed(2)), side: "BUY", timestamp: String(Date.now()) }); this.emit(e); } } };
})();
</script>
<script type="module" src="../app.js"></script>
</body></html>
