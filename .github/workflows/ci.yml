name: CI

on:
  push:
    branches: [main, movement, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # A segfault should print a Python traceback in the log, not just 139.
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install the Qt / X libraries a headless run needs
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            xvfb \
            libegl1 libgl1 libglib2.0-0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libfontconfig1 libdbus-1-3 \
            fontconfig fonts-dejavu-core

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the project and its dev tools
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      # Under Xvfb, so Qt uses its xcb platform. Exit with os._exit: PySide6
      # finalisation after the session QApplication is gone segfaults on the
      # runner, and skipping finalisation avoids it. -n auto fans the tests
      # over the cores.
      - name: Test
        run: |
          xvfb-run -a uv run python -c "
          import os, sys, pytest
          code = pytest.main(['-q', '-n', 'auto'])
          sys.stdout.flush(); sys.stderr.flush()
          os._exit(int(code))
          "

  # The Rust walk is optional; build it and check the native path agrees with
  # the Python one.
  native:
    runs-on: ubuntu-latest
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build the project with the native core
        run: uv sync --extra native

      - name: The native walk matches the Python one
        run: uv run pytest tests/test_core.py tests/test_playback.py -q
